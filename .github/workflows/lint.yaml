name: lint
on:
  workflow_call:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go environment
        uses: m0t0k1ch1-go/workflows/.github/actions/setup-go-env@main
        with:
          cache-key-prefix: lint
      - name: Lint
        run: |
          go mod tidy -diff
          go vet ./...
          go tool staticcheck ./...
